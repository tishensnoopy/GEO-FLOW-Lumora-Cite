# deploy/nginx/conf.d/default.conf（HTTPS 版）
# nginx 容器：对外 80+443 端口，80 重定向到 443，443 代理 dashboard + index-monitor API

# HTTP → HTTPS 重定向（保留 .well-known 供证书续期）
server {
    listen 80;
    server_name zkeeeai.com;

    # Let's Encrypt 证书续期验证路径（webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余请求 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name zkeeeai.com;

    # SSL 证书（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/zkeeeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zkeeeai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API 反向代理（/api/ 转发到 index-monitor FastAPI）
    location /api/ {
        proxy_pass http://index-monitor:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard 静态资源（其他所有路径转发到 dashboard 容器 nginx）
    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
