# deploy/nginx/conf.d/default.conf（反向代理配置）
# nginx 容器：对外 80 端口，代理 dashboard + index-monitor API
server {
    listen 80;
    server_name _;

    # API 反向代理（/api/ 转发到 index-monitor FastAPI）
    location /api/ {
        proxy_pass http://index-monitor:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard 静态资源（其他所有路径转发到 dashboard 容器 nginx）
    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
