# 双系统分流：zkeeeai.com → GEOFlow；monitor.zkeeeai.com → 监测系统
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ① HTTP :80（双域名）→ ACME 验证 + 301 HTTPS
server {
    listen 80;
    server_name zkeeeai.com monitor.zkeeeai.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ② HTTPS zkeeeai.com → GEOFlow（官网）
server {
    listen 443 ssl;
    http2 on;
    server_name zkeeeai.com;
    ssl_certificate     /etc/letsencrypt/live/zkeeeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zkeeeai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 64m;
    location / {
        proxy_pass http://geoflow-web-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ③ HTTPS monitor.zkeeeai.com → 监测系统
server {
    listen 443 ssl;
    http2 on;
    server_name monitor.zkeeeai.com;
    ssl_certificate     /etc/letsencrypt/live/monitor.zkeeeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.zkeeeai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 10m;
    location /api/ {
        proxy_pass http://index-monitor:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
